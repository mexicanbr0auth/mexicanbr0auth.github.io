<!DOCTYPE html><html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meus Códigos Python no GitHub</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --panel-2: #1f2630;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #2f81f7;
      --accent-2: #58a6ff;
      --ok: #238636;
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
      --radius: 20px;
    }* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background:
    radial-gradient(circle at top left, rgba(47, 129, 247, 0.14), transparent 30%),
    radial-gradient(circle at top right, rgba(88, 166, 255, 0.1), transparent 25%),
    var(--bg);
  color: var(--text);
  min-height: 100vh;
}

a { color: inherit; text-decoration: none; }

.container {
  width: min(1200px, calc(100% - 32px));
  margin: 0 auto;
  padding: 32px 0 48px;
}

.hero {
  display: grid;
  gap: 18px;
  padding: 28px;
  border: 1px solid var(--border);
  border-radius: 28px;
  background: linear-gradient(180deg, rgba(22, 27, 34, 0.96), rgba(15, 20, 27, 0.92));
  box-shadow: var(--shadow);
  margin-bottom: 26px;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  width: fit-content;
  padding: 10px 14px;
  border: 1px solid rgba(88, 166, 255, 0.25);
  border-radius: 999px;
  background: rgba(47, 129, 247, 0.10);
  color: var(--accent-2);
  font-size: 0.95rem;
  font-weight: 600;
}

h1 {
  margin: 0;
  font-size: clamp(2rem, 4vw, 3.4rem);
  line-height: 1.05;
}

.subtitle {
  margin: 0;
  max-width: 800px;
  color: var(--muted);
  font-size: 1.04rem;
  line-height: 1.7;
}

.toolbar {
  display: grid;
  grid-template-columns: 1.2fr 0.8fr 0.8fr;
  gap: 14px;
  margin: 22px 0 24px;
}

.input,
.select {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: rgba(22, 27, 34, 0.96);
  color: var(--text);
  padding: 14px 16px;
  outline: none;
  font-size: 0.98rem;
  transition: border-color 0.2s ease, transform 0.2s ease;
}

.input:focus,
.select:focus {
  border-color: var(--accent);
  transform: translateY(-1px);
}

.stats {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 18px;
}

.stat {
  padding: 10px 14px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: rgba(22, 27, 34, 0.92);
  color: var(--muted);
  font-size: 0.95rem;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
  gap: 18px;
}

.card {
  display: grid;
  gap: 14px;
  min-height: 230px;
  padding: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: linear-gradient(180deg, rgba(31, 38, 48, 0.95), rgba(18, 23, 30, 0.95));
  box-shadow: var(--shadow);
  transition: transform 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
  cursor: pointer;
}

.card:hover {
  transform: translateY(-5px);
  border-color: rgba(88, 166, 255, 0.48);
  box-shadow: 0 24px 48px rgba(0, 0, 0, 0.35);
}

.card-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}

.repo-name {
  margin: 0;
  font-size: 1.22rem;
  line-height: 1.25;
  word-break: break-word;
}

.language {
  flex-shrink: 0;
  padding: 6px 10px;
  border-radius: 999px;
  background: rgba(35, 134, 54, 0.16);
  border: 1px solid rgba(35, 134, 54, 0.24);
  color: #7ee787;
  font-size: 0.82rem;
  font-weight: 700;
}

.desc {
  margin: 0;
  color: var(--muted);
  line-height: 1.7;
  min-height: 66px;
}

.meta {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: auto;
}

.pill {
  padding: 8px 11px;
  border-radius: 999px;
  font-size: 0.85rem;
  border: 1px solid var(--border);
  background: rgba(255, 255, 255, 0.02);
  color: var(--text);
}

.footer-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  color: var(--muted);
  font-size: 0.92rem;
}

.open {
  color: var(--accent-2);
  font-weight: 700;
}

.state {
  border: 1px dashed var(--border);
  border-radius: 22px;
  padding: 28px;
  background: rgba(22, 27, 34, 0.6);
  color: var(--muted);
  text-align: center;
}

.spinner {
  width: 42px;
  height: 42px;
  margin: 0 auto 14px;
  border-radius: 50%;
  border: 4px solid rgba(88, 166, 255, 0.14);
  border-top-color: var(--accent-2);
  animation: spin 0.9s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@media (max-width: 860px) {
  .toolbar {
    grid-template-columns: 1fr;
  }

  .container {
    width: min(100% - 20px, 1200px);
  }

  .hero {
    padding: 22px;
  }
}

  </style>
</head>
<body>
  <main class="container">
    <section class="hero">
      <span class="badge">🐍 Projetos em Python do GitHub</span>
      <h1>Meus códigos Python</h1>
      <p class="subtitle">
        Aqui Esta Alguns Dos Meus Codigos em Python .</p>
    </section><section class="toolbar">
  <input id="searchInput" class="input" type="text" placeholder="Pesquisar repositório, descrição ou tópico..." />
  <select id="sortSelect" class="select">
    <option value="updated">Mais recentes</option>
    <option value="stars">Mais estrelas</option>
    <option value="name">Nome (A-Z)</option>
  </select>
  <select id="visibilitySelect" class="select">
    <option value="all">Todos</option>
    <option value="public">Somente públicos</option>
    <option value="forks_off">Sem forks</option>
  </select>
</section>

<section class="stats" id="stats"></section>
<section id="content"></section>

  </main>  <script>
    const username = "mexicanbr0auth";
    const apiUrl = `https://api.github.com/users/${username}/repos?per_page=100&sort=updated`;

    const content = document.getElementById("content");
    const stats = document.getElementById("stats");
    const searchInput = document.getElementById("searchInput");
    const sortSelect = document.getElementById("sortSelect");
    const visibilitySelect = document.getElementById("visibilitySelect");

    let repos = [];

    function formatDate(dateString) {
      return new Intl.DateTimeFormat("pt-BR", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
      }).format(new Date(dateString));
    }

    function escapeHtml(text = "") {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function renderStats(items) {
      const totalStars = items.reduce((sum, repo) => sum + repo.stargazers_count, 0);
      const totalForks = items.reduce((sum, repo) => sum + repo.forks_count, 0);

      stats.innerHTML = `
        <div class="stat">👤 Usuário: <strong>${username}</strong></div>
        <div class="stat">🐍 Repositórios Python: <strong>${items.length}</strong></div>
        <div class="stat">⭐ Estrelas somadas: <strong>${totalStars}</strong></div>
        <div class="stat">🍴 Forks somados: <strong>${totalForks}</strong></div>
      `;
    }

    function renderLoading() {
      content.innerHTML = `
        <div class="state">
          <div class="spinner"></div>
          <p>Carregando repositórios Python do GitHub...</p>
        </div>
      `;
    }

    function renderError(message) {
      content.innerHTML = `
        <div class="state">
          <h3>Não foi possível carregar os repositórios.</h3>
          <p>${escapeHtml(message)}</p>
        </div>
      `;
    }

    function applyFilters() {
      const q = searchInput.value.trim().toLowerCase();
      const sortBy = sortSelect.value;
      const visibility = visibilitySelect.value;

      let filtered = [...repos].filter((repo) => {
        const haystack = [
          repo.name,
          repo.description || "",
          ...(repo.topics || [])
        ].join(" ").toLowerCase();

        const matchesSearch = haystack.includes(q);
        const matchesVisibility =
          visibility === "all" ||
          (visibility === "public" && !repo.private) ||
          (visibility === "forks_off" && !repo.fork);

        return matchesSearch && matchesVisibility;
      });

      filtered.sort((a, b) => {
        if (sortBy === "stars") return b.stargazers_count - a.stargazers_count;
        if (sortBy === "name") return a.name.localeCompare(b.name, "pt-BR");
        return new Date(b.updated_at) - new Date(a.updated_at);
      });

      renderStats(filtered);
      renderRepos(filtered);
    }

    function renderRepos(items) {
      if (!items.length) {
        content.innerHTML = `
          <div class="state">
            <h3>Nenhum repositório encontrado.</h3>
            <p>Tenta mudar a pesquisa ou o filtro para ver mais projetos.</p>
          </div>
        `;
        return;
      }

      const html = items.map((repo) => {
        const topics = (repo.topics || []).slice(0, 3).map(topic => `<span class="pill">#${escapeHtml(topic)}</span>`).join("");
        const desc = repo.description ? escapeHtml(repo.description) : "Sem descrição adicionada ainda.";

        return `
          <a class="card" href="${repo.html_url}" target="_blank" rel="noopener noreferrer" aria-label="Abrir repositório ${escapeHtml(repo.name)}">
            <div class="card-top">
              <h2 class="repo-name">${escapeHtml(repo.name)}</h2>
              <span class="language">${escapeHtml(repo.language || "Python")}</span>
            </div>

            <p class="desc">${desc}</p>

            <div class="meta">
              <span class="pill">⭐ ${repo.stargazers_count}</span>
              <span class="pill">🍴 ${repo.forks_count}</span>
              <span class="pill">📦 ${repo.visibility || "public"}</span>
              ${topics}
            </div>

            <div class="footer-line">
              <span>Atualizado em ${formatDate(repo.updated_at)}</span>
              <span class="open">Abrir repositório ↗</span>
            </div>
          </a>
        `;
      }).join("");

      content.innerHTML = `<div class="grid">${html}</div>`;
    }

    async function loadRepos() {
      renderLoading();

      try {
        const response = await fetch(apiUrl, {
          headers: {
            "Accept": "application/vnd.github+json",
            "X-GitHub-Api-Version": "2022-11-28"
          }
        });

        if (!response.ok) {
          throw new Error(`Erro ${response.status}: ${response.statusText}`);
        }

        const data = await response.json();

        repos = data.filter((repo) => repo.language === "Python");
        applyFilters();
      } catch (error) {
        renderError(error.message || "Erro desconhecido ao consultar a API do GitHub.");
      }
    }

    searchInput.addEventListener("input", applyFilters);
    sortSelect.addEventListener("change", applyFilters);
    visibilitySelect.addEventListener("change", applyFilters);

    loadRepos();
  </script></body>
</html>
